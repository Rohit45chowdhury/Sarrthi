services:
  # ---------- Reverse proxy (only public entry) ----------
  nginx:
    image: nginx:alpine
    container_name: saarthi-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - gateway
      - frontend
    restart: always

  # ---------- Frontend (React/Vite build served by nginx) ----------
  frontend:
    build:
      context: ./Frontend
      args:
        # use your real domain, or http://<server-ip> for testing
        VITE_API_URL: ${PUBLIC_URL:-http://localhost}
    container_name: saarthi-frontend
    restart: always

  # ---------- Gateway ----------
  gateway:
    build: ./Backend/gateway
    container_name: saarthi-gateway
    env_file: ./Backend/gateway/.env
    environment:
      PORT: 3000
      FRONTEND_URL: ${PUBLIC_URL:-http://localhost}
      USER_SERVICE_URL: http://user-service:3001
      CAPTAIN_SERVICE_URL: http://captain-service:3002
      RIDE_SERVICE_URL: http://ride-service:3003
      MAPS_SERVICE_URL: http://maps-service:3004
      NOTIFICATION_SERVICE_URL: http://notification-service:3005
      AUTH_SERVICE_URL: http://auth-service:3006
    depends_on:
      - user-service
      - captain-service
      - ride-service
      - maps-service
      - notification-service
      - auth-service
    restart: always

  # ---------- Microservices ----------
  user-service:
    build: ./Backend/services/user-service
    container_name: saarthi-user
    env_file: ./Backend/services/user-service/.env
    environment:
      PORT: 3001
    restart: always

  captain-service:
    build: ./Backend/services/captain-service
    container_name: saarthi-captain
    env_file: ./Backend/services/captain-service/.env
    environment:
      PORT: 3002
      KAFKA_BROKERS: kafka:9092
    depends_on:
      - kafka
    restart: always

  ride-service:
    build: ./Backend/services/ride-service
    container_name: saarthi-ride
    env_file: ./Backend/services/ride-service/.env
    environment:
      PORT: 3003
      USER_SERVICE_URL: http://user-service:3001
      CAPTAIN_SERVICE_URL: http://captain-service:3002
      MAPS_SERVICE_URL: http://maps-service:3004
      NOTIFICATION_SERVICE_URL: http://notification-service:3005
    restart: always

  maps-service:
    build: ./Backend/services/maps-service
    container_name: saarthi-maps
    env_file: ./Backend/services/maps-service/.env
    environment:
      PORT: 3004
    restart: always

  notification-service:
    build: ./Backend/services/notification-service
    container_name: saarthi-notification
    env_file: ./Backend/services/notification-service/.env
    environment:
      PORT: 3005
      FRONTEND_URL: ${PUBLIC_URL:-http://localhost}
      CAPTAIN_SERVICE_URL: http://captain-service:3002
      USER_SERVICE_URL: http://user-service:3001
    restart: always

  auth-service:
    build: ./Backend/services/auth-service
    container_name: saarthi-auth
    env_file: ./Backend/services/auth-service/.env
    environment:
      PORT: 3006
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: ${PUBLIC_URL:-http://localhost}
    depends_on:
      - redis
    restart: always

  # ---------- Infrastructure ----------
  redis:
    image: redis:7-alpine
    container_name: saarthi-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    restart: always

  kafka:
    image: apache/kafka:3.7.0
    container_name: saarthi-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: always

volumes:
  redis_data:
  kafka_data: