
services:
  # ---------- Nginx Reverse Proxy ----------
  nginx:
    build:
      context: ./Backend/nginx
    container_name: saarthi-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - frontend
      - gateway
    restart: always

  # ---------- React / Vite Frontend ----------
  frontend:
    build:
      context: ./Frontend
      args:
        VITE_API_URL: ${PUBLIC_URL:-http://localhost}
    container_name: saarthi-frontend
    restart: always

  # ---------- API Gateway ----------
  gateway:
    build:
      context: ./Backend/gateway
    container_name: saarthi-gateway
    env_file:
      - ./Backend/gateway/.env
    environment:
      PORT: "3000"
      FRONTEND_URL: ${PUBLIC_URL:-http://localhost}
      USER_SERVICE_URL: http://user-service:3001
      CAPTAIN_SERVICE_URL: http://captain-service:3002
      RIDE_SERVICE_URL: http://ride-service:3003
      MAPS_SERVICE_URL: http://maps-service:3004
      NOTIFICATION_SERVICE_URL: http://notification-service:3005
    depends_on:
      - user-service
      - captain-service
      - ride-service
      - maps-service
      - notification-service
    restart: always

  # ---------- User Service (includes authentication) ----------
  user-service:
    build:
      context: ./Backend/services/user-service
    container_name: saarthi-user
    env_file:
      - ./Backend/services/user-service/.env
    environment:
      PORT: "3001"
    restart: always

  # ---------- Captain Service ----------
  captain-service:
    build:
      context: ./Backend/services/captain-service
    container_name: saarthi-captain
    env_file:
      - ./Backend/services/captain-service/.env
    environment:
      PORT: "3002"
      KAFKA_BROKERS: kafka:9092
    depends_on:
      - kafka
    restart: always

  # ---------- Ride Service ----------
  ride-service:
    build:
      context: ./Backend/services/ride-service
    container_name: saarthi-ride
    env_file:
      - ./Backend/services/ride-service/.env
    environment:
      PORT: "3003"
      USER_SERVICE_URL: http://user-service:3001
      CAPTAIN_SERVICE_URL: http://captain-service:3002
      MAPS_SERVICE_URL: http://maps-service:3004
      NOTIFICATION_SERVICE_URL: http://notification-service:3005
    restart: always

  # ---------- Maps Service ----------
  maps-service:
    build:
      context: ./Backend/services/maps-service
    container_name: saarthi-maps
    env_file:
      - ./Backend/services/maps-service/.env
    environment:
      PORT: "3004"
    restart: always

  # ---------- Notification / Socket.IO Service ----------
  notification-service:
    build:
      context: ./Backend/services/notification-service
    container_name: saarthi-notification
    env_file:
      - ./Backend/services/notification-service/.env
    environment:
      PORT: "3005"
      FRONTEND_URL: ${PUBLIC_URL:-http://localhost}
      CAPTAIN_SERVICE_URL: http://captain-service:3002
      USER_SERVICE_URL: http://user-service:3001
    restart: always

  # ---------- Redis ----------
  redis:
    image: redis:7-alpine
    container_name: saarthi-redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data:/data
    restart: always

  # ---------- Kafka (KRaft mode) ----------
  kafka:
    image: apache/kafka:3.7.0
    container_name: saarthi-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: always

volumes:
  redis_data:
  kafka_data:
