
resolver 8.8.8.8 1.1.1.1 valid=30s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_x_forwarded_for $client_ip {
    default                 $remote_addr;
    ~^(?<first_ip>[^,\s]+) $first_ip;
}

split_clients "$client_ip" $gateway_host {
    50% saarthi-gateway.onrender.com;
    *   saarthi-gateway-2.onrender.com;
}

server {
    listen 10000;
    server_name _;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Socket.IO -> Notification Service
    location /socket.io/ {
        proxy_pass https://saarthi-notification.onrender.com/socket.io/;

        proxy_http_version 1.1;

        proxy_ssl_server_name on;
        proxy_ssl_name saarthi-notification.onrender.com;

        proxy_set_header Host saarthi-notification.onrender.com;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_buffering off;
    }

    # API -> Gateway load balancing
    location / {
        proxy_pass https://$gateway_host;

        proxy_http_version 1.1;

        proxy_ssl_server_name on;
        proxy_ssl_name $gateway_host;

        proxy_set_header Host $gateway_host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
